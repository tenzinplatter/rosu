[package]
name = "rosu"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bevy = { version = "0.19", features = ["dynamic_linking"] }
expand-tilde = "0.6.1"
osu-file-parser = "1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
uuid = { version = "1.23.4", features = ["v4"] }

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
